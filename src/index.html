<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8faf7">
  <meta name="description" content="SQLD 문제 풀이와 SQL 실습">
  <title>SQLD Sprint</title>
  <style>/* STYLES */</style>
</head>
<body>
<svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
  <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 6c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v15"/></symbol>
  <symbol id="icon-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/></symbol>
  <symbol id="icon-bookmark" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4V4Z"/></symbol>
  <symbol id="icon-notes" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></symbol>
  <symbol id="icon-keyboard" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 15h10"/></symbol>
  <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
  <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
  <symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/></symbol>
  <symbol id="icon-type" viewBox="0 0 24 24"><path d="m3 18 5-12 5 12M5 14h6m5-2c1-2 5-2 5 1v5m0-4c-7-2-7 6 0 3"/></symbol>
  <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
  <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></symbol>
  <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
  <symbol id="icon-code" viewBox="0 0 24 24"><path d="m7 6-5 6 5 6m10-12 5 6-5 6M14 4l-4 16"/></symbol>
  <symbol id="icon-bulb" viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4M8 14a6 6 0 1 1 8 0l-1 2H9l-1-2Z"/></symbol>
  <symbol id="icon-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M10 10v10"/></symbol>
  <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="icon-key" viewBox="0 0 24 24"><circle cx="8" cy="9" r="4"/><path d="m11 12 8 8m-4-4 2-2m0 4 2-2"/></symbol>
  <symbol id="icon-link" viewBox="0 0 24 24"><path d="m10 14 4-4m-6 2-2 2a4 4 0 0 0 6 6l2-2m2-6 2-2a4 4 0 0 0-6-6l-2 2"/></symbol>
  <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
</defs></svg>
<a class="skip" href="#main">{{skip}}</a>
<header class="app-header"><div class="header-inner">
  <a href="#quiz" class="brand" aria-label="SQLD Sprint"><span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#icon-terminal"/></svg></span><span>SQLD <b>Sprint</b></span></a>
  <nav class="main-nav" aria-label="{{navigation}}">
    <button data-view="quiz" class="nav-item active"><svg class="icon" aria-hidden="true"><use href="#icon-book"/></svg><span>{{navQuiz}}</span></button>
    <button data-view="lab" class="nav-item"><svg class="icon" aria-hidden="true"><use href="#icon-terminal"/></svg><span>{{navLab}}</span></button>
    <button data-view="review" class="nav-item"><svg class="icon" aria-hidden="true"><use href="#icon-bookmark"/></svg><span>{{navReview}}</span><span class="nav-count" id="wrong-count" hidden>0</span></button>
    <button data-view="notes" class="nav-item"><svg class="icon" aria-hidden="true"><use href="#icon-notes"/></svg><span>{{navNotes}}</span></button>
  </nav>
  <div class="header-tools">
    <details class="reading-menu"><summary class="icon-button" aria-label="{{textSize}}" title="{{textSize}}"><svg class="icon" aria-hidden="true"><use href="#icon-type"/></svg></summary><div class="reading-options"><label for="reading-size">{{textSize}}</label><select id="reading-size"><option value="comfortable">{{textDefault}}</option><option value="large">{{textLarge}}</option><option value="extra">{{textExtra}}</option></select></div></details>
    <button class="icon-button" data-action="help" aria-label="{{shortcuts}}" title="{{shortcuts}}"><svg class="icon" aria-hidden="true"><use href="#icon-keyboard"/></svg></button>
    <button class="icon-button" data-action="about" aria-label="{{info}}" title="{{info}}"><svg class="icon" aria-hidden="true"><use href="#icon-info"/></svg></button>
  </div>
</div></header>
<p id="save-label" class="storage-warning" role="status" hidden></p>
<main id="main" tabindex="-1"></main>
<dialog id="modal" aria-label="{{info}}"><div id="modal-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>{{javascriptRequired}}</noscript>
<!-- LICENSE -->
<script id="sql-engine" type="text/plain">/* ENGINE */</script>
<script>/* COURSE */</script>
<script>/* APP */</script>
</body>
</html>
