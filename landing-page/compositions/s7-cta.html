      <defs>
        <filter id="s7-cta-mb-0" x="-300%" y="-20%" width="700%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur class="s7-cta-mb" stdDeviation="0 0"></feGaussianBlur></filter>
        <filter id="s7-cta-mb-1" x="-300%" y="-20%" width="700%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur class="s7-cta-mb" stdDeviation="0 0"></feGaussianBlur></filter>
        <filter id="s7-cta-mb-2" x="-300%" y="-20%" width="700%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur class="s7-cta-mb" stdDeviation="0 0"></feGaussianBlur></filter>
        <filter id="s7-cta-mb-3" x="-300%" y="-20%" width="700%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur class="s7-cta-mb" stdDeviation="0 0"></feGaussianBlur></filter>
        <filter id="s7-cta-mb-4" x="-300%" y="-20%" width="700%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur class="s7-cta-mb" stdDeviation="0 0"></feGaussianBlur></filter>
        <filter id="s7-cta-mb-5" x="-300%" y="-20%" width="700%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur class="s7-cta-mb" stdDeviation="0 0"></feGaussianBlur></filter>
        <filter id="s7-cta-mb-6" x="-300%" y="-20%" width="700%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur class="s7-cta-mb" stdDeviation="0 0"></feGaussianBlur></filter>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const q = (sel) => Array.prototype.slice.call(document.querySelectorAll(sel));
      const later = { immediateRender: false };

      // 0~3 s: three pale rings spread from the centre and are gone by 2.6 s. Frame 0 is plain White.
      q("#s7-cta-rings .s7-cta-ring").forEach((ring, i) => {
        const s = 0.1 + i * 0.28, dur = 2.2 - i * 0.2;
        tl.fromTo(ring, { attr: { r: 60, "stroke-width": 6 - i } }, { attr: { r: 1150, "stroke-width": 1.5 }, duration: dur, ease: "expo.out" }, s);
        tl.fromTo(ring, { opacity: 0 }, { opacity: 0.36 - i * 0.07, duration: 0.16, ease: "none" }, s);
        tl.fromTo(ring, { opacity: 0.36 - i * 0.07 }, Object.assign({ opacity: 0, duration: dur - 0.16, ease: "sine.inOut" }, later), s + 0.16);
      });

      // Product rises 30 px and fades up (0.4~2.8 s).
      tl.fromTo("#s7-cta-product-in", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 2.4, ease: "power2.inOut" }, 0.4);

      // 3~4.5 s: official logo, opacity and uniform scale only (no blur, skew or crop).
      tl.fromTo("#s7-cta-logo-img", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.inOut" }, 3.1);

      // 4.5~6 s: name letters fly in from the right; horizontal blur only while moving, none at rest.
      const blurs = q("#s7-cta-fx .s7-cta-mb");
      q("#s7-cta-name .s7-cta-ch").forEach((ch, i) => {
        const s = 4.5 + i * 0.055, dur = 0.7;
        tl.fromTo(ch, { x: 560, scaleX: 1.35 }, { x: 0, scaleX: 1, duration: dur, ease: "expo.out" }, s);
        tl.fromTo(ch, { opacity: 0 }, { opacity: 1, duration: 0.09, ease: "none" }, s);
        tl.fromTo(blurs[i], { attr: { stdDeviation: "46 0" } }, { attr: { stdDeviation: "0 0" }, duration: dur, ease: "expo.out" }, s);
        tl.set(ch, { filter: "url(#s7-cta-mb-" + i + ")" }, s);
        tl.set(ch, { filter: "none" }, s + dur);
      });

      // 6~7 s: tagline one word at a time, pale to ink and rising 12 px; each red period pops just after its word.
      q("#s7-cta-tagline .s7-cta-word").forEach((word, i) => {
        const s = 6 + i * 0.3;
        tl.fromTo(word, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, s);
        tl.fromTo(word, { y: 12 }, { y: 0, duration: 0.3, ease: "power2.inOut" }, s);
        tl.fromTo(word.querySelector(".s7-cta-wb"), { color: "#B8B2AC" }, { color: "#000000", duration: 0.3, ease: "power2.inOut" }, s);
        const dot = word.querySelector(".s7-cta-dot");
        tl.fromTo(dot, { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2.2)" }, s + 0.07);
        tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, s + 0.07);
      });

      // Discs spread from their shared centre behind the product with the tagline, outer first, settled by 6.66 s.
      // back.out(1) peaks at 1.037x, which the sizes above leave room for.
      q("#s7-cta-discs .s7-cta-disc").forEach((disc, i) => {
        tl.fromTo(disc, { scale: 0 }, { scale: 1, duration: 0.52, ease: "back.out(1)" }, 6 + i * 0.07);
      });

      // 7~8 s: model line.
      tl.fromTo("#s7-cta-model-text", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.inOut" }, 7.05);

      // 8~9 s: model number pill pops 0.9 -> 1.0 and is settled by 8.7 s. The shell's button follows at 9 s (93 s).
      tl.fromTo("#s7-cta-pill", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 8.05);
      tl.fromTo("#s7-cta-pill", { scale: 0.9 }, { scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 8.05);

      // Hold to the end of the 16 s slot (94~100 s is the reading position).
      tl.set({}, {}, 16);
      window.__timelines["s7-cta"] = tl;
    })();
  </script>
