  <script>
    (function () {
      // Scene clock 0-12 s = page 8-20 %. The red cover is a mask; from 7 s the glyph fills become exact-outline holes onto s3 below.
      const tl = gsap.timeline({ paused: true });
      const q = (s) => "#s2-detect-" + s;
      const LINES = [{"len":697.01,"v":496.42,"phase":0.08773,"alpha":0.34},{"len":415.13,"v":539.46,"phase":0.87748,"alpha":0.39},{"len":439.1,"v":443.47,"phase":0.43816000000000005,"alpha":0.37},{"len":686.33,"v":657.89,"phase":0.50983,"alpha":0.31},{"len":461.52,"v":671,"phase":0.6333099999999999,"alpha":0.37},{"len":381.77,"v":626.92,"phase":0.92536,"alpha":0.39},{"len":392.55,"v":606.72,"phase":0.81356,"alpha":0.32},{"len":331.86,"v":622.75,"phase":0.84373,"alpha":0.33}];
      const T = { x: -294.12, y: 93.75 };
      const Z_SLOW = 1.15, PAN_SLOW = 0.12, Z_END = 44.1;
      const SLOW = [7.0, 8.5], DIVE = [8.5, 11.85];

      tl.fromTo(q("glow"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
      tl.fromTo(q("glow"), { opacity: 1 }, { opacity: 0, duration: 1.5, ease: "power1.in", immediateRender: false }, 7.0);

      // Warm Grey arc rises from below, then sinks before the title lands.
      tl.fromTo(q("arc"), { attr: { transform: "translate(0 1520)" } }, { attr: { transform: "translate(0 1160)" }, duration: 0.9, ease: "power3.out" }, 0);
      tl.fromTo(q("arc"), { attr: { transform: "translate(0 1160)" } }, { attr: { transform: "translate(0 1580)" }, duration: 1.1, ease: "power3.in", immediateRender: false }, 0.9);
      tl.fromTo(q("arcband"), { attr: { cy: 40 } }, { attr: { cy: 0 }, duration: 0.9, ease: "power3.out" }, 0);
      tl.fromTo(q("arcband"), { attr: { cy: 0 } }, { attr: { cy: 30 }, duration: 1.1, ease: "power3.in", immediateRender: false }, 0.9);

      // Glyphs rise from below the baseline clip, one by one.
      [0, 1, 2].forEach((i) => {
        tl.fromTo(q("rise" + i), { attr: { transform: "translate(0 415.97)" } }, { attr: { transform: "translate(0 0)" }, duration: 0.95, ease: "power4.out" }, 0.25 + i * 0.35);
      });
      tl.fromTo(q("pulse"), { attr: { transform: "scale(1)" } }, { attr: { transform: "scale(1.035)" }, duration: 0.08, ease: "power2.out" }, 1.9);
      tl.fromTo(q("pulse"), { attr: { transform: "scale(1.035)" } }, { attr: { transform: "scale(1)" }, duration: 0.17, ease: "power2.inOut", immediateRender: false }, 1.98);

      // Landing ring spreads from behind the title and is gone by 2.5 s (page 10.5 %).
      tl.fromTo(q("ring"), { opacity: 0 }, { opacity: 0.9, duration: 0.02, ease: "none" }, 1.75);
      tl.fromTo(q("ring"), { opacity: 0.9 }, { opacity: 0, duration: 0.73, ease: "power1.in", immediateRender: false }, 1.77);
      tl.fromTo(q("ring"), { attr: { r: 254.18, "stroke-width": 13.56 } }, { attr: { r: 1186.19, "stroke-width": 1.5 }, duration: 0.73, ease: "power2.out", immediateRender: false }, 1.77);

      // Speed lines fall as a function of scene time only, so they move while scrolling and stop when scrolling stops.
      const LINE_END = 9.6;
      LINES.forEach((l, i) => {
        const id = q("line" + i), top = -960 - l.len, span = 1920 + l.len;
        let t = 0, p = l.phase * span, first = true;
        while (t < LINE_END - 1e-6) {
          const dt = Math.min((span - p) / l.v, LINE_END - t);
          tl.fromTo(id, { attr: { y: top + p } }, { attr: { y: top + p + l.v * dt }, duration: dt, ease: "none", immediateRender: first }, t);
          first = false;
          t += dt;
          p = 0;
        }
        tl.fromTo(id, { opacity: 0 }, { opacity: l.alpha, duration: 0.5, ease: "power1.out" }, 0);
        tl.fromTo(id, { opacity: l.alpha }, { opacity: 0, duration: 1.0, ease: "power1.in", immediateRender: false }, 8.4);
      });

      // Fill -> hole, left glyph first: a bottom-to-top wipe moves the boundary between the fill clip and the hole clip.
      [0, 1].forEach((i) => {
        const at = 7.0 + i * 0.4;
        tl.fromTo(q("fr" + i), { attr: { height: 4189.62 } }, { attr: { height: 3810.38 }, duration: 0.6, ease: "power2.inOut" }, at);
        tl.fromTo(q("hr" + i), { attr: { y: 189.62 } }, { attr: { y: -189.62 }, duration: 0.6, ease: "power2.inOut" }, at);
      });

      // Camera: slow push, then an accelerating dive into the stroke of the bottom ㅁ in 감 until the hole covers the canvas.
      // Zoom runs in log space; each phase starts at the speed the previous one ended with.
      const lnSlow = Math.log(Z_SLOW), slowDur = SLOW[1] - SLOW[0], diveDur = DIVE[1] - DIVE[0];
      const span = Math.log(Z_END) - lnSlow;
      const a = Math.min(1, ((2 * lnSlow) / slowDur) * (diveDur / span));
      const b = Math.min(1, ((2 * PAN_SLOW) / slowDur) * (diveDur / (1 - PAN_SLOW)));
      const slowZoomEase = (u) => (Math.exp(lnSlow * u * u) - 1) / (Z_SLOW - 1);
      const diveZoomEase = (p) => (Math.exp(lnSlow + span * (a * p + (1 - a) * p * p * p)) - Z_SLOW) / (Z_END - Z_SLOW);
      const divePanEase = (p) => b * p + (1 - b) * p * p * (3 - 2 * p);
      const zooms = ".s2-detect-zoom", pans = ".s2-detect-pan";
      const pan = (k) => "translate(" + (T.x * (1 - k)).toFixed(3) + " " + (T.y * (1 - k)).toFixed(3) + ")";
      tl.fromTo(zooms, { attr: { transform: "scale(1)" } }, { attr: { transform: "scale(" + Z_SLOW + ")" }, duration: slowDur, ease: slowZoomEase }, SLOW[0]);
      tl.fromTo(zooms, { attr: { transform: "scale(" + Z_SLOW + ")" } }, { attr: { transform: "scale(" + Z_END + ")" }, duration: diveDur, ease: diveZoomEase, immediateRender: false }, DIVE[0]);
      tl.fromTo(pans, { attr: { transform: pan(0) } }, { attr: { transform: pan(PAN_SLOW) }, duration: slowDur, ease: "power2.in" }, SLOW[0]);
      tl.fromTo(pans, { attr: { transform: pan(PAN_SLOW) } }, { attr: { transform: pan(1) }, duration: diveDur, ease: divePanEase, immediateRender: false }, DIVE[0]);

      // The hole now covers the canvas: drop the cover so only s3 shows until the host ends at 12 s.
      tl.fromTo(q("stage"), { opacity: 1 }, { opacity: 0, duration: 0.02, ease: "none" }, 11.86);

      window.__timelines["s2-detect"] = tl;
    })();
